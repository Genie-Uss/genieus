server:
  port: ${GATEWAY_PORT}

spring:
  application:
    name: ${GATEWAY_HOST}
  config:
    import: 'classpath:dev-route.yml'
  cloud:
    config:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST}:${EUREKA_PORT}/eureka/
  instance:
    preferIpAddress: true
    hostname: ${spring.application.name}
    instanceId: ${spring.application.name}:${server.port}
    metadataMap:
      management.port: ${management.server.port}

resilience4j:
  circuitbreaker:
    instances:
      defaultService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 5
        registerHealthIndicator: true

logging:
  level:
    root: WARN
    shop.genieus: INFO
  config: classpath:logback-dev.xml

management:
  server:
    port: ${MANAGEMENT_GATEWAY_PORT}
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST}:${ZIPKIN_PORT}/api/v2/spans
  tracing:
    sampling:
      probability: 1.0
web:
  client:
    url:
      auth: ${AUTH_WEB_CLIENT_URL}
