          filters:
            - TokenExtractor
            - Authentication

        # ================================= 프로모션(promotions)
        - id: promotion-list
          uri: lb://PROMOTION-SERVICE
          predicates:
            - Path=/api/v1/promotions
            - Method=GET
          filters:
            - TokenExtractor
            - Authentication

        - id: promotion-detail
          uri: lb://PROMOTION-SERVICE
          predicates:
            - Path=/api/v1/promotions/{promotionId}
            - Method=GET
          filters:

        - id: promotion-create
          uri: lb://PROMOTION-SERVICE
          predicates:
            - Path=/api/v1/promotions
            - Method=POST
          filters:
            - TokenExtractor
            - Authentication

        - id: promotion-update
          uri: lb://PROMOTION-SERVICE
          predicates:
            - Path=/api/v1/promotions/{promotionId}
            - Method=PUT
          filters:
            - TokenExtractor
            - Authentication

        - id: promotion-delete
          uri: lb://PROMOTION-SERVICE
          predicates:
            - Path=/api/v1/promotions/{promotionId}
            - Method=DELETE
          filters:
            - TokenExtractor
            - Authentication