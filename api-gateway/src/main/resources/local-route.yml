          filters:
            - TokenExtractor
            - Authentication

        - id: coupon-apply
          uri: lb://COUPON-SERVICE
          predicates:
            - Path=/api/v1/coupons/{couponId}
            - Method=POST
          filters:
            - TokenExtractor
            - Authentication

        - id: coupon-end
          uri: lb://COUPON-SERVICE
          predicates:
            - Path=/api/v1/coupons/{couponId}/end
            - Method=PUT
          filters:
