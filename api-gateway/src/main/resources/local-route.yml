        - id: coupon-stop
          uri: lb://COUPON-SERVICE
          predicates:
            - Path=/api/v1/coupons/{couponId}/stop
            - Method=PUT
          filters:
            - TokenExtractor
            - Authentication

        - id: coupon-withdraw
          uri: lb://COUPON-SERVICE
          predicates:
            - Path=/api/v1/coupons/{couponUserId}/withdraw
            - Method=PUT
          filters:
            - TokenExtractor
            - Authentication

        # ================================= 결제(payments)
        - id: payment-list
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/v1/payments
            - Method=GET
          filters:
            - TokenExtractor
            - Authentication

        - id: payment-detail
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/v1/payments/{paymentId}
            - Method=GET
          filters:
            - TokenExtractor
