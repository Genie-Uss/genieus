server:
  port: ${ORDER_PORT}

spring:
  application:
    name: ${ORDER_HOST}
  cloud:
    config:
      enabled: false
    circuitbreaker:
      resilience4j:
        enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}
    template:
      default-topic: order-events
    consumer:
      group-id: order-service
      topic:
        payment: payment-events
        order: order-events

  # === database ===
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 4
      connection-timeout: 30000
      idle-timeout: 300000       # 5분
      max-lifetime: 1800000      # 30분
      leak-detection-threshold: 2000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
      # JDBC batch를 50건 단위로 묶어서 executeBatch() 호출
      jdbc.batch_size: 50
      # UPDATE SQL을 엔티티별로 묶어서 전송
      order_updates: true
      # 버전 필드가 있는 엔티티도 batch로 처리
      batch_versioned_data: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST}:${EUREKA_PORT}/eureka/
  instance:
    preferIpAddress: true
    hostname: ${spring.application.name}
    instanceId: ${spring.application.name}:${server.port}
    metadataMap:
      management.port: ${management.server.port}

logging:
  level:
    root: WARN
    com.genieus: DEBUG
    shop.genieus: DEBUG
  config: classpath:logback-dev.xml

management:
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST}:${ZIPKIN_PORT}/api/v2/spans
  tracing:
    sampling:
      probability: 1.0
  server:
    port: ${MANAGEMENT_ORDER_PORT}
  endpoints:
    web:
      exposure:
        include: health,prometheus,info

### 커스텀
resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        record-exceptions:
          - java.io.IOException
          - feign.RetryableException
          - feign.FeignException.FeignServerException
        ignore-exceptions:
          - shop.genieus.order.global.exception.CustomNotFoundException
          - feign.FeignException.FeignClientException
    instances:
      productServiceClient:
        base-config: default
      promotionServiceClient:
        base-config: default
      paymentServiceClient:
        base-config: default
      couponServiceClient:
        base-config: default

order:
  cancel-policy:
    order-pending: 2
  scheduler:
    poll-interval: 60000