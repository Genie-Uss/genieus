server:
  port: ${ORDER_PORT}

spring:
  application:
    name: ${ORDER_HOST}
  cloud:
    config:
      enabled: false
    circuitbreaker:
      resilience4j:
        enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}
    template:
      default-topic: order-events
    consumer:
      group-id: order-service
      topic:
        payment: payment-events
        order: order-events

  # === database ===
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@${EUREKA_HOST}:${EUREKA_PORT}/eureka/
  instance:
    preferIpAddress: true
    hostname: ${spring.application.name}
    instanceId: ${spring.application.name}:${server.port}
    metadataMap:
      management.port: ${management.server.port}

logging:
  level:
    root: info
    shop.genieus: debug
    org.springframework.cloud.gateway: debug
    org.springframework.web.reactive: info
    reactor.netty: warn

management:
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST}:${ZIPKIN_PORT}/api/v2/spans
  tracing:
    sampling:
      probability: 1.0
  server:
    port: ${MANAGEMENT_ORDER_PORT}
  endpoints:
    web:
      exposure:
        include: health,prometheus

### 커스텀
resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        record-exceptions:
          - java.io.IOException
          - feign.RetryableException
          - feign.FeignException.FeignServerException
        ignore-exceptions:
          - shop.genieus.order.global.exception.CustomNotFoundException.PromotionNotFoundException
          - feign.FeignException.FeignClientException
    instances:
      productServiceClient:
        base-config: default
      promotionServiceClient:
        base-config: default
      paymentServiceClient:
        base-config: default
      couponServiceClient:
        base-config: default

order:
  cancel-policy:
    order-pending: 1
  scheduler:
    poll-interval: 30000