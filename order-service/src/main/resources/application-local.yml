eureka:
  client:
    serviceUrl:
      defaultZone: http://username:password@localhost:8761/eureka/
  instance:
    preferIpAddress: true
    hostname: ${spring.application.name}
    instanceId: ${spring.application.name}:${server.port}

spring:
  cloud:
    config:
      enabled: false
    circuitbreaker:
      resilience4j:
        enabled: true
  config:
    import: 'classpath:docker-database.yml'
  kafka:
    bootstrap-servers: localhost:19092,localhost:19093
    template:
      default-topic: order
    consumer:
      group-id: order-service
      topic:
        payment: payment
        order: order

logging:
  level:
    root: info
    shop.genieus: debug
    org.springframework.cloud.gateway: debug
    org.springframework.web.reactive: info
    reactor.netty: warn

management:
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        record-exceptions:
          - java.io.IOException
          - feign.RetryableException
          - feign.FeignException.FeignServerException
        ignore-exceptions:
          - shop.genieus.order.global.exception.CustomNotFoundException.PromotionNotFoundException
          - feign.FeignException.FeignClientException
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
        cancel-running-future: true
order:
  cancel-policy:
    order-pending: 1
    payment-pending: 1