name: Manual CI/CD Trigger for Individual Service

on:
  workflow_dispatch:
    inputs:
      target_service:
        description: '배포할 서비스 선택'
        required: true
        type: choice
        options:
          - service-registry
          - api-gateway
          - auth-service
          - coupon-service
          - product-service
          - promotion-service
          - order-service
          - user-service
          - payment-service

jobs:
  deploy-service:
    runs-on: ubuntu-22.04
    env:
      SERVICE_NAME: ${{ github.event.inputs.target_service }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        env:
          COMMON_GITHUB_USER: ${{ secrets.COMMON_GITHUB_USER }}
          COMMON_GITHUB_TOKEN: ${{ secrets.COMMON_GITHUB_TOKEN }}
        run: |
          cd $SERVICE_NAME
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push Docker Image to ECR
        run: |
          cd $SERVICE_NAME
          docker build -t $SERVICE_NAME .
          docker tag $SERVICE_NAME:latest ${{ secrets.ECR_REGISTRY }}/$SERVICE_NAME:latest
          docker push ${{ secrets.ECR_REGISTRY }}/$SERVICE_NAME:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        env:
          SERVICE_PORT: ${{
            github.event.inputs.target_service == 'service-registry' && secrets.EUREKA_PORT ||
            github.event.inputs.target_service == 'api-gateway' && secrets.GATEWAY_PORT ||
            github.event.inputs.target_service == 'auth-service' && secrets.AUTH_PORT ||
            github.event.inputs.target_service == 'product-service' && secrets.PRODUCT_PORT ||
            github.event.inputs.target_service == 'user-service' && secrets.USER_PORT ||
            github.event.inputs.target_service == 'coupon-service' && secrets.COUPON_PORT ||
            github.event.inputs.target_service == 'promotion-service' && secrets.PROMOTION_PORT ||
            github.event.inputs.target_service == 'order-service' && secrets.ORDER_PORT ||
            github.event.inputs.target_service == 'payment-service' && secrets.PAYMENT_PORT || '7070'}}
        with:
          host: ${{ secrets.PRIVATE_HOST }}
          username: ${{ secrets.PRIVATE_USER }}
          key: ${{ secrets.PRIVATE_SSH_KEY }}
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_username: ${{ secrets.BASTION_USER }}
          proxy_key: ${{ secrets.BASTION_SSH_KEY }}
          debug: true
          script_stop: true
          script: |
            cd /home/ubuntu/projects
            DOCKER_CONFIG=/dev/null aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            docker stop $SERVICE_NAME || true
            docker rm $SERVICE_NAME || true
            docker image prune -af || true
            docker pull ${{ secrets.ECR_REGISTRY }}/$SERVICE_NAME:latest
            docker run -d --name $SERVICE_NAME \
              --env-file .env \
              --network shared-net \
              -p $SERVICE_PORT:$SERVICE_PORT \
              ${{ secrets.ECR_REGISTRY }}/$SERVICE_NAME:latest
