# GitHub Actions: 모든 서비스를 ECR로 Push + EC2에서 Pull & Run (with .env)
name: CI/CD with GitHub Actions, Docker, and ECR

on:
  push:
    branches: [ "feature/profile-setting" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        service:
          - name: "eureka"
            folder: "service-registry"
          - name: "gateway"
            folder: "api-gateway"
          - name: "auth"
            folder: "auth-service"
          - name: "coupon"
            folder: "coupon-service"
          - name: "product"
            folder: "product-service"
          - name: "promotion"
            folder: "promotion-service"
          - name: "order"
            folder: "order-service"
          - name: "user"
            folder: "user-service"
          - name: "payment"
            folder: "payment-service"

    steps:
      # 1. Git 저장소 체크아웃
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. JDK 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle 빌드 (테스트 제외)
      - name: Build with Gradle
        env:
          COMMON_GITHUB_USER: ${{ secrets.COMMON_GITHUB_USER }}
          COMMON_GITHUB_TOKEN: ${{ secrets.COMMON_GITHUB_TOKEN }}
        run: |
          cd ${{ matrix.service.folder }}
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon

      # 4. AWS 자격증명 구성
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # 5. ECR 로그인
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Docker 이미지 빌드 및 ECR 푸시
      - name: Build, Tag and Push Docker Image to ECR
        run: |
          cd ${{ matrix.service.folder }}
          docker build -t genieus-${{ matrix.service.name }} .
          docker tag genieus-${{ matrix.service.name }}:latest ${{ secrets.ECR_REGISTRY }}/genieus-${{ matrix.service.name }}:latest
          docker push ${{ secrets.ECR_REGISTRY }}/genieus-${{ matrix.service.name }}:latest