# GitHub Actions: 변경된 서비스만 ECR로 Push + EC2에서 Pull & Run (with .env)
name: CI/CD with GitHub Actions, Docker, and ECR

on:
  push:
    branches: [ "test-deploy" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        service:
          - name: "eureka"
            folder: "service-registry"
          - name: "gateway"
            folder: "api-gateway"
          - name: "auth"
            folder: "auth-service"
          - name: "coupon"
            folder: "coupon-service"
          - name: "product"
            folder: "product-service"
          - name: "promotion"
            folder: "promotion-service"
          - name: "order"
            folder: "order-service"
          - name: "user"
            folder: "user-service"
          - name: "payment"
            folder: "payment-service"

    steps:
      # 1. Git 저장소 체크아웃
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 2. 변경된 서비스 폴더 감지
      - name: Detect Changed Services
        id: detect_changes
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          SERVICES_TO_BUILD=""
          for FILE in $CHANGED_FILES; do
            FOLDER=$(echo "$FILE" | cut -d'/' -f1)
            if [[ ! "$SERVICES_TO_BUILD" =~ "$FOLDER" ]]; then
              SERVICES_TO_BUILD="$SERVICES_TO_BUILD $FOLDER"
            fi
          done
          echo "services_to_build=$SERVICES_TO_BUILD" >> $GITHUB_ENV

      # 3. 변경되지 않은 서비스는 Skip
      - name: Skip Unchanged Services
        if: ${{ !contains(env.services_to_build, matrix.service.folder) }}
        run: |
          echo "Skipping ${{ matrix.service.name }}"
          exit 0

      # 4. JDK 17 설치
      - name: Set up JDK 17
        if: ${{ contains(env.services_to_build, matrix.service.folder) }}
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 5. Gradle 빌드 (테스트 제외)
      - name: Build with Gradle
        if: ${{ contains(env.services_to_build, matrix.service.folder) }}
        env:
          COMMON_GITHUB_USER: ${{ secrets.COMMON_GITHUB_USER }}
          COMMON_GITHUB_TOKEN: ${{ secrets.COMMON_GITHUB_TOKEN }}
        run: |
          cd ${{ matrix.service.folder }}
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon

      # 6. AWS 자격증명 구성
      - name: Configure AWS Credentials
        if: ${{ contains(env.services_to_build, matrix.service.folder) }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # 7. ECR 로그인
      - name: Login to ECR
        if: ${{ contains(env.services_to_build, matrix.service.folder) }}
        uses: aws-actions/amazon-ecr-login@v2

      # 8. Docker 이미지 빌드 (서비스 디렉토리 내에서)
      - name: Build, Tag and Push Docker Image to ECR
        if: ${{ contains(env.services_to_build, matrix.service.folder) }}
        run: |
          cd ${{ matrix.service.folder }}
          docker build -t genieus-${{ matrix.service.name }} .
          docker tag genieus-${{ matrix.service.name }}:latest ${{ secrets.ECR_REGISTRY }}/genieus-${{ matrix.service.name }}:latest
          docker push ${{ secrets.ECR_REGISTRY }}/genieus-${{ matrix.service.name }}:latest


      # 9. EC2에 SSH 접속하여 배포 수행
      - name: Deploy to EC2
        if: ${{ contains(env.services_to_build, matrix.service.folder) }}
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.BASTION_HOST }}              # 퍼블릭 EC2 IP
          username: ${{ secrets.BASTION_USER }}          # ex. ubuntu
          key: ${{ secrets.BASTION_SSH_KEY }}            # 퍼블릭 인스턴스 SSH key
          proxy_host: ${{ secrets.PRIVATE_HOST }}        # 프라이빗 인스턴스 내부 IP
          proxy_username: ${{ secrets.PRIVATE_USER }}    # ex. ubuntu
          proxy_key: ${{ secrets.PRIVATE_SSH_KEY }}      # 퍼블릭 인스턴스에 저장된 프라이빗 인스턴스 키
          script: |
            # EC2에서 서비스 디렉토리로 이동 (.env 포함돼 있어야 함)
            cd /home/ubuntu/projects

            # ECR 로그인
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            # 기존 컨테이너 종료 및 제거
            docker stop ${{ matrix.service.name }} || true
            docker rm ${{ matrix.service.name }} || true

            # 최신 Docker 이미지 Pull
            docker pull ${{ secrets.ECR_REGISTRY }}/genieus-${{ matrix.service.name }}:latest

            # .env 파일을 주입하여 docker run 실행
            docker run -d --name ${{ matrix.service.name }} \
              --env-file .env \
              --network shared-net \
              -p ${{ secrets[format('{0}_PORT', upper(matrix.service.name))] }}:${{ secrets[format('{0}_PORT', upper(matrix.service.name))] }} \
              ${{ secrets.ECR_REGISTRY }}/genieus-${{ matrix.service.name }}:latest
