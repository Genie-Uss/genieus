server:
  port: ${CONFIG_PORT}

spring:
  application:
    name: config-server
  profiles:
    active: dev
  cloud:
    config:
      server:
        git:
          uri: https://github.com/${CONFIG_GIT_REPO}
          default-label: ${CONFIG_GIT_BRANCH:main}
          username: ${CONFIG_GIT_USERNAME}
          password: ${CONFIG_GIT_TOKEN}
          clone-on-start: ${CONFIG_GIT_CLONE_ON_START:true}
          search-paths:
            - '{application}'
            - '{application}/{profile}'
            - 'common'